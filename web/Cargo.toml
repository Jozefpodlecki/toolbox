[package]
name = "toolbox-web"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Jozefpodlecki/toolbox"
description = ""
categories = [""]
keywords = ["yew"]
rust-version = "1.96.0"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20.0"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
js-sys = "0.3.91"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
rmp-serde = "1.3.1"
rmp = "0.8.15"
console_error_panic_hook = "0.1.7"
futures = "0.3.32"
log = "0.4.29"
wasm-logger = "0.2.0"
gloo = "0.11"
yew_icons = {version = "0.10", features = ["lucide", "simple_icons"]}
rand = "0.10.0"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
chrono = { version = "0.4.44", features = ["serde"] }
thiserror = "2.0.20"
iso-viewer = { path = "../crates/iso-viewer" }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Navigator",
    "Clipboard",
    "ClipboardEvent",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "BeforeUnloadEvent",
    "CssStyleDeclaration",
    "MouseEvent",
    "DomRect",
    "DomTokenList",
    "DomStringMap",
    "DragEvent",
    "DataTransfer",
    "File",
    "FileList",
    "FileReader",
]