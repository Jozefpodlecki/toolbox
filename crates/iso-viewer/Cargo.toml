[package]
name = "iso-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
categories = ["no-std"]
authors = ["Jozef Podlecki <jozef.witold.podlecki@gmail.com>"]
repository = "https://github.com/Jozefpodlecki/iso-viewer"

[dev-dependencies]

[dependencies]
rand = "0.10.2"
bitflags = "2.13.1"
heapless = "0.9.3"
stack_dst = { version = "0.8.1", default-features = false, features = [] }
crc = { version = "3.4.0" }
hadris-iso = { version = "2.2.0" }
hadris-fat = { version = "2.2.0" }
bytemuck = "1.25.2"
thiserror = { version = "2.0.20", default-features = false }
hex = "0.4.3"
log = "0.4.29"

[features]
default = ["alloc"]
alloc = []